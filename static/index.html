<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Local · YouTube → MP3</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:        oklch(8% 0.02 285);
    --bg2:       oklch(11% 0.025 285);
    --bg3:       oklch(14% 0.03 285);
    --line:      oklch(22% 0.04 285);
    --line2:     oklch(18% 0.03 285);
    --text:      oklch(93% 0.01 285);
    --muted:     oklch(60% 0.02 285);
    --faint:     oklch(38% 0.02 285);
    --purple:    oklch(65% 0.22 290);
    --purple-b:  oklch(55% 0.24 290);
    --purple-hi: oklch(78% 0.18 290);
    --glow:      oklch(65% 0.22 290 / 0.35);
    --glow-sm:   oklch(65% 0.22 290 / 0.15);
    --ok:        oklch(72% 0.16 155);
    --err:       oklch(65% 0.18 25);
    --r: 12px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Barlow", system-ui, sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 0 20px 60px;
    overflow-x: hidden;
  }

  body::before {
    content: "";
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(ellipse 60% 40% at 50% -10%, oklch(55% 0.24 290 / 0.18), transparent),
      radial-gradient(ellipse 40% 30% at 90% 60%,  oklch(60% 0.20 270 / 0.10), transparent),
      radial-gradient(ellipse 50% 40% at 10% 80%,  oklch(55% 0.22 300 / 0.08), transparent);
  }

  .wrap { width: 100%; max-width: 600px; position: relative; z-index: 1; }

  /* ── LANG SWITCHER ── */
  .lang-bar {
    display: flex; justify-content: flex-end;
    padding: 18px 0 0;
  }
  .lang-toggle {
    display: flex; align-items: center;
    background: var(--bg2); border: 1px solid var(--line);
    border-radius: 99px; padding: 3px;
    gap: 2px;
  }
  .lang-btn {
    padding: 5px 13px; border-radius: 99px; border: none;
    font-family: "Barlow", sans-serif; font-size: 11px; font-weight: 500;
    letter-spacing: 0.12em; text-transform: uppercase;
    cursor: pointer; color: var(--faint); background: transparent;
    transition: all .2s cubic-bezier(.4,0,.2,1);
  }
  .lang-btn.active {
    background: linear-gradient(135deg, var(--purple-b), var(--purple));
    color: oklch(96% 0.01 285);
    box-shadow: 0 0 12px var(--glow-sm);
  }
  .lang-btn:not(.active):hover { color: var(--text); }

  /* ── HEADER ── */
  header {
    padding: 40px 0 44px;
    display: flex; flex-direction: column; align-items: flex-start;
  }

  .kicker {
    font-family: "Barlow", sans-serif; font-weight: 500;
    font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase;
    color: var(--purple); margin-bottom: 16px;
    display: flex; align-items: center; gap: 10px;
  }
  .kicker::before {
    content: ""; display: block; width: 24px; height: 1px;
    background: linear-gradient(90deg, var(--purple), transparent);
  }

  h1 {
    font-family: "Bebas Neue", sans-serif;
    font-size: clamp(56px, 12vw, 88px);
    line-height: 0.92; letter-spacing: 0.01em; color: var(--text);
  }
  h1 .accent {
    display: block;
    background: linear-gradient(135deg, var(--purple-hi) 0%, var(--purple) 50%, var(--purple-b) 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 18px var(--glow));
  }

  .sub {
    margin-top: 18px; font-size: 14px; font-weight: 300; line-height: 1.7;
    color: var(--muted); max-width: 48ch;
  }

  /* ── CARDS ── */
  .card {
    background: linear-gradient(160deg, var(--bg2) 0%, var(--bg3) 100%);
    border: 1px solid var(--line); border-radius: var(--r);
    padding: 28px; position: relative; overflow: hidden;
  }
  .card::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--purple), transparent);
    opacity: 0.6;
  }

  .field-label {
    font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--faint); margin-bottom: 10px; font-weight: 500;
  }

  input[type=text] {
    width: 100%; background: var(--bg); border: 1px solid var(--line);
    color: var(--text); border-radius: 9px; padding: 14px 16px;
    font-family: "Barlow", sans-serif; font-weight: 300; font-size: 14px;
    outline: none; transition: border-color .2s, box-shadow .2s;
    caret-color: var(--purple);
  }
  input[type=text]:focus {
    border-color: var(--purple-b);
    box-shadow: 0 0 0 3px var(--glow-sm), inset 0 0 20px oklch(55% 0.24 290 / 0.04);
  }
  input::placeholder { color: var(--faint); }

  /* ── QUALITY ── */
  .quality { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-top: 20px; }
  .q-opt {
    padding: 11px 8px; border: 1px solid var(--line); border-radius: 9px;
    cursor: pointer; text-align: center;
    font-family: "Bebas Neue", sans-serif; font-size: 18px; letter-spacing: 0.05em;
    color: var(--faint); transition: all .18s cubic-bezier(.4,0,.2,1); user-select: none;
  }
  .q-opt span {
    display: block; font-family: "Barlow", sans-serif;
    font-size: 9px; letter-spacing: 0.18em; text-transform: uppercase;
    margin-top: 1px; font-weight: 500;
  }
  .q-opt:hover { border-color: oklch(55% 0.24 290 / 0.5); color: var(--text); }
  .q-opt.active {
    background: linear-gradient(135deg, oklch(55% 0.24 290 / 0.22), oklch(55% 0.24 290 / 0.08));
    border-color: var(--purple-b); color: var(--purple-hi);
    box-shadow: 0 0 16px var(--glow-sm), inset 0 1px 0 oklch(65% 0.22 290 / 0.2);
  }

  /* ── BUTTON ── */
  .go {
    width: 100%; margin-top: 20px; padding: 15px;
    background: linear-gradient(135deg, var(--purple-b) 0%, var(--purple) 60%, oklch(70% 0.20 295) 100%);
    color: oklch(96% 0.01 285); border: none; border-radius: 9px;
    font-family: "Bebas Neue", sans-serif; font-size: 20px; letter-spacing: 0.1em;
    cursor: pointer; transition: filter .2s, transform .12s, box-shadow .2s;
    box-shadow: 0 4px 24px var(--glow), 0 1px 0 oklch(75% 0.18 290 / 0.3) inset;
  }
  .go:hover { filter: brightness(1.1); box-shadow: 0 6px 32px var(--glow), 0 1px 0 oklch(75% 0.18 290 / 0.3) inset; transform: translateY(-1px); }
  .go:active { transform: translateY(0); filter: brightness(0.95); }
  .go:disabled { opacity: .45; cursor: not-allowed; transform: none; filter: none; }

  /* ── PROGRESS ── */
  .status { margin-top: 22px; display: none; }
  .status.show { display: block; }
  .bar-track { height: 4px; background: var(--bg); border-radius: 99px; overflow: hidden; border: 1px solid var(--line2); position: relative; }
  .bar-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--purple-b), var(--purple), var(--purple-hi));
    border-radius: 99px; transition: width .35s cubic-bezier(.4,0,.2,1); position: relative;
  }
  .bar-fill::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.25) 50%, transparent 100%);
    background-size: 200% 100%; animation: shimmer 1.4s infinite;
  }
  @keyframes shimmer { from { background-position: -200% 0 } to { background-position: 200% 0 } }

  .status-row { display: flex; justify-content: space-between; align-items: center; margin-top: 11px; font-size: 12px; }
  .state-badge { display: inline-flex; align-items: center; gap: 6px; color: var(--purple-hi); font-weight: 400; }
  .state-badge::before {
    content: ""; display: block; width: 5px; height: 5px;
    border-radius: 50%; background: var(--purple); box-shadow: 0 0 6px var(--purple);
    animation: pulse 1.2s ease-in-out infinite;
  }
  .state-badge.done::before { background: var(--ok); box-shadow: 0 0 6px var(--ok); animation: none; }
  .state-badge.done { color: var(--ok); }
  .state-badge.err::before  { background: var(--err); box-shadow: 0 0 6px var(--err); animation: none; }
  .state-badge.err  { color: var(--err); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .pct { color: var(--faint); font-size: 12px; }

  .dl-link {
    display: none; margin-top: 14px; padding: 12px 16px; border-radius: 9px;
    border: 1px solid oklch(72% 0.16 155 / 0.4); background: oklch(72% 0.16 155 / 0.06);
    color: var(--ok); text-align: center; text-decoration: none; font-size: 13px; font-weight: 400;
    transition: background .18s, border-color .18s; letter-spacing: 0.04em;
  }
  .dl-link.show { display: block; }
  .dl-link:hover { background: oklch(72% 0.16 155 / 0.12); border-color: var(--ok); }

  /* ── DIVIDER ── */
  .divider { height: 1px; margin: 28px 0; background: linear-gradient(90deg, transparent, var(--line), transparent); }

  /* ── LIBRARY ── */
  .lib-head { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:18px; }
  .lib-head h2 { font-family: "Bebas Neue", sans-serif; font-size: 26px; letter-spacing: 0.04em; color: var(--text); }
  .lib-count { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--faint); font-weight: 500; }
  .lib-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 13px 0; border-bottom: 1px solid var(--line2); transition: background .15s;
  }
  .lib-item:last-child { border-bottom: none; }
  .lib-item:hover { background: oklch(65% 0.22 290 / 0.03); margin: 0 -28px; padding-left: 28px; padding-right: 28px; }
  .lib-name { font-size: 13px; font-weight: 400; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 68%; }
  .lib-meta { display:flex; align-items:center; gap:14px; flex-shrink:0; }
  .lib-size { font-size: 11px; color: var(--faint); }
  .lib-dl {
    font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--purple-hi); text-decoration: none; font-weight: 500;
    padding: 5px 10px; border-radius: 6px; border: 1px solid oklch(65% 0.22 290 / 0.3);
    transition: all .16s;
  }
  .lib-dl:hover { background: oklch(65% 0.22 290 / 0.12); border-color: var(--purple-hi); box-shadow: 0 0 10px var(--glow-sm); }
  .lib-empty { font-size: 13px; color: var(--faint); padding: 8px 0; font-style: italic; }

  /* ── FOOTER ── */
  footer { margin-top: 32px; font-size: 11px; color: var(--faint); text-align: center; line-height: 1.8; }

  /* ── ENTRANCE ── */
  @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
  .lang-bar { animation: fadeUp .4s cubic-bezier(.2,0,0,1) both; }
  header    { animation: fadeUp .6s .05s cubic-bezier(.2,0,0,1) both; }
  .card:nth-of-type(1) { animation: fadeUp .6s .12s cubic-bezier(.2,0,0,1) both; }
  .card:nth-of-type(2) { animation: fadeUp .6s .22s cubic-bezier(.2,0,0,1) both; }
</style>
</head>
<body>
<div class="wrap">

  <!-- LANG SWITCHER -->
  <div class="lang-bar">
    <div class="lang-toggle">
      <button class="lang-btn active" data-lang="es">ES</button>
      <button class="lang-btn"        data-lang="en">EN</button>
    </div>
  </div>

  <header>
    <div class="kicker" data-i18n="kicker"></div>
    <h1>YouTube<span class="accent">→ MP3</span></h1>
    <p class="sub" data-i18n="sub"></p>
  </header>

  <div class="card">
    <div class="field-label" data-i18n="urlLabel"></div>
    <input type="text" id="url" autocomplete="off" data-i18n-placeholder="urlPlaceholder" />

    <div class="quality" id="quality">
      <div class="q-opt" data-q="128">128<span>kbps</span></div>
      <div class="q-opt active" data-q="192">192<span>kbps</span></div>
      <div class="q-opt" data-q="320">320<span>kbps</span></div>
    </div>

    <button class="go" id="goBtn" data-i18n="goBtn"></button>

    <div class="status" id="status">
      <div class="bar-track"><div class="bar-fill" id="barFill"></div></div>
      <div class="status-row">
        <span class="state-badge" id="badge"></span>
        <span class="pct" id="pctText">0%</span>
      </div>
      <a class="dl-link" id="dlLink" href="#" data-i18n="dlLink"></a>
    </div>
  </div>

  <div class="divider"></div>

  <div class="card">
    <div class="lib-head">
      <h2 data-i18n="libTitle"></h2>
      <span class="lib-count" id="libCount">—</span>
    </div>
    <div id="libList"><div class="lib-empty" data-i18n="libLoading"></div></div>
  </div>

  <footer data-i18n-html="footer"></footer>

</div>
<script>
// ── TRANSLATIONS ──────────────────────────────────────────────
const I18N = {
  es: {
    kicker:         "Descargador local · yt-dlp + ffmpeg",
    sub:            "Pega un enlace, elige la calidad y descarga el audio en tu máquina. Sin nubes, sin terceros.",
    urlLabel:       "Enlace del vídeo",
    urlPlaceholder: "https://www.youtube.com/watch?v=…",
    goBtn:          "Descargar audio",
    dlLink:         "↓ Guardar archivo MP3",
    libTitle:       "Biblioteca",
    libLoading:     "Cargando…",
    libEmpty:       "Todavía no hay descargas.",
    libFile:        (n) => `${n} archivo${n === 1 ? "" : "s"}`,
    libDown:        "↓ Bajar",
    footer:         "Solo uso local — no expongas esta app en red pública.<br>Descarga únicamente contenido que tengas derecho a descargar.",
    states: {
      queued:      "En cola…",
      downloading: "Descargando…",
      converting:  "Convirtiendo a MP3…",
      done:        "Listo",
      error:       "Error"
    },
    connLost: "conexión perdida"
  },
  en: {
    kicker:         "Local downloader · yt-dlp + ffmpeg",
    sub:            "Paste a link, pick quality and download audio to your machine. No cloud, no third parties.",
    urlLabel:       "Video URL",
    urlPlaceholder: "https://www.youtube.com/watch?v=…",
    goBtn:          "Download audio",
    dlLink:         "↓ Save MP3 file",
    libTitle:       "Library",
    libLoading:     "Loading…",
    libEmpty:       "No downloads yet.",
    libFile:        (n) => `${n} file${n === 1 ? "" : "s"}`,
    libDown:        "↓ Save",
    footer:         "Local use only — do not expose this app on a public server.<br>Only download content you have the right to download.",
    states: {
      queued:      "Queued…",
      downloading: "Downloading…",
      converting:  "Converting to MP3…",
      done:        "Done",
      error:       "Error"
    },
    connLost: "connection lost"
  }
};

let lang = localStorage.getItem("lang") || "es";
let quality = "192";

function applyLang() {
  const t = I18N[lang];
  document.documentElement.lang = lang;

  document.querySelectorAll("[data-i18n]").forEach(el => {
    el.textContent = t[el.dataset.i18n] || "";
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    el.placeholder = t[el.dataset.i18nPlaceholder] || "";
  });
  document.querySelectorAll("[data-i18n-html]").forEach(el => {
    el.innerHTML = t[el.dataset.i18nHtml] || "";
  });

  // update lang buttons
  document.querySelectorAll(".lang-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });

  // re-render library with new language
  renderLibrary();
}

// ── LANG TOGGLE ──────────────────────────────────────────────
document.querySelectorAll(".lang-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    if (btn.dataset.lang === lang) return;
    lang = btn.dataset.lang;
    localStorage.setItem("lang", lang);

    // pill slide animation
    btn.style.transform = "scale(0.92)";
    setTimeout(() => btn.style.transform = "", 150);

    applyLang();
  });
});

// ── QUALITY ──────────────────────────────────────────────────
document.querySelectorAll(".q-opt").forEach(opt => {
  opt.addEventListener("click", () => {
    document.querySelectorAll(".q-opt").forEach(o => o.classList.remove("active"));
    opt.classList.add("active");
    quality = opt.dataset.q;
  });
});

// ── DOWNLOAD ─────────────────────────────────────────────────
const urlInput  = document.getElementById("url");
const goBtn     = document.getElementById("goBtn");
const statusBox = document.getElementById("status");
const barFill   = document.getElementById("barFill");
const badge     = document.getElementById("badge");
const pctText   = document.getElementById("pctText");
const dlLink    = document.getElementById("dlLink");

async function start() {
  const url = urlInput.value.trim();
  if (!url) { urlInput.focus(); return; }
  const t = I18N[lang];

  goBtn.disabled = true;
  statusBox.classList.add("show");
  dlLink.classList.remove("show");
  badge.className = "state-badge";
  badge.textContent = t.states.queued;
  barFill.style.width = "0%";
  pctText.textContent = "0%";

  try {
    const res = await fetch("/api/download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url, quality })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Error");
    poll(data.job_id);
  } catch (e) { fail(e.message); }
}

function fail(msg) {
  const t = I18N[lang];
  badge.className = "state-badge err";
  badge.textContent = (t.states.error || "Error") + ": " + msg;
  pctText.textContent = "";
  goBtn.disabled = false;
}

function poll(jobId) {
  const iv = setInterval(async () => {
    try {
      const res = await fetch("/api/status/" + jobId);
      const job = await res.json();
      const t = I18N[lang];

      badge.textContent = t.states[job.status] || job.status;
      if (typeof job.progress === "number") {
        barFill.style.width = job.progress + "%";
        pctText.textContent = Math.round(job.progress) + "%";
      }

      if (job.status === "done") {
        clearInterval(iv);
        badge.className = "state-badge done";
        badge.textContent = job.title ? "✓ " + job.title : t.states.done;
        barFill.style.width = "100%";
        pctText.textContent = "100%";
        dlLink.href = "/api/file/" + encodeURIComponent(job.filename);
        dlLink.classList.add("show");
        goBtn.disabled = false;
        loadLibrary();
      } else if (job.status === "error") {
        clearInterval(iv);
        fail(job.error || "unknown error");
      }
    } catch (e) { clearInterval(iv); fail(I18N[lang].connLost); }
  }, 700);
}

// ── LIBRARY ──────────────────────────────────────────────────
let cachedFiles = [];

async function loadLibrary() {
  try {
    const res = await fetch("/api/library");
    cachedFiles = await res.json();
    renderLibrary();
  } catch (e) { /* silencio */ }
}

function renderLibrary() {
  const t = I18N[lang];
  const list = document.getElementById("libList");
  const count = document.getElementById("libCount");

  count.textContent = t.libFile(cachedFiles.length);

  if (!cachedFiles.length) {
    list.innerHTML = `<div class="lib-empty">${t.libEmpty}</div>`;
    return;
  }
  list.innerHTML = cachedFiles.map(f => `
    <div class="lib-item">
      <span class="lib-name" title="${f.name}">${f.name}</span>
      <span class="lib-meta">
        <span class="lib-size">${f.size_mb} MB</span>
        <a class="lib-dl" href="/api/file/${encodeURIComponent(f.name)}">${t.libDown}</a>
      </span>
    </div>`).join("");
}

goBtn.addEventListener("click", start);
urlInput.addEventListener("keydown", e => { if (e.key === "Enter") start(); });

// ── INIT ─────────────────────────────────────────────────────
applyLang();
loadLibrary();
</script>
</body>
</html>
